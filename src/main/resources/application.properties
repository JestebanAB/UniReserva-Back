spring.application.name=UniReserva-Back
spring.config.import=optional:classpath:application-local.properties

# El esquema ya existe en Neon: Hibernate no lo toca. Cambia a "validate" cuando el esquema esté estable.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

spring.datasource.url=${DATABASE_URL_POOLED}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

## JWT / sesión por cookie HttpOnly
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}
jwt.remember-me-expiration=${JWT_REMEMBER_ME_EXPIRATION:1209600000}
auth.cookie.secure=${AUTH_COOKIE_SECURE:false}
auth.cookie.same-site=${AUTH_COOKIE_SAME_SITE:Lax}

## CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

## Agente de IA (Gemini, nivel gratuito)
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.1-flash-lite}
gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
# Incluye los tokens de "pensamiento" del modelo, por eso es mayor que la respuesta visible
gemini.max-tokens=2048
gemini.timeout-seconds=45

## Reglas de negocio
app.timezone=America/Bogota
